services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: resumecraft
      POSTGRES_PASSWORD: resumecraft
      POSTGRES_DB: resumecraft
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumecraft"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: