[project]
name = "resumecraft"
version = "0.1.0"
description = "AI resume crafting backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "python-multipart>=0.0.20",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "structlog>=24.4",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "anyio>=4.6",
    "rendercv>=2.8",
    "rendercv-fonts>=0.5.1",
    "typst>=0.14.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resumecraft"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
packages = ["resumecraft"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not llm and not network and not db and not render'"
markers = [
    "llm: tests that call a real LLM API",
    "network: tests that require external network access",
    "db: tests that require a real Postgres (docker compose up)",
    "render: tests that run the real rendercv/typst render pipeline",
]

[tool.importlinter]
root_package = "resumecraft"

[[tool.importlinter.contracts]]
name = "api is the outermost layer"
type = "forbidden"
source_modules = [
    "resumecraft.core",
    "resumecraft.db",
    "resumecraft.ai",
    "resumecraft.services",
    "resumecraft.schemas",
    "resumecraft.prompts",
    "resumecraft.worker",
]
forbidden_modules = ["resumecraft.api"]

[[tool.importlinter.contracts]]
name = "services never import api or worker"
type = "forbidden"
source_modules = ["resumecraft.services"]
forbidden_modules = ["resumecraft.worker", "resumecraft.api"]

[[tool.importlinter.contracts]]
name = "ai and prompts are independent of business logic"
type = "forbidden"
source_modules = ["resumecraft.ai", "resumecraft.prompts"]
forbidden_modules = ["resumecraft.services", "resumecraft.api", "resumecraft.worker", "resumecraft.db"]

[[tool.importlinter.contracts]]
name = "worker never imports api"
type = "forbidden"
source_modules = ["resumecraft.worker"]
forbidden_modules = ["resumecraft.api"]